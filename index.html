<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{SITE}</title>
<meta name="description" content="영상을 올리고 보는 곳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='1' y='6' width='30' height='21' rx='6' fill='%23ff3b3b'/><path d='M13 11v11l9-5.5z' fill='white'/></svg>">
</head>
<body>
<header class="topbar" id="topbar"></header>
<nav class="chips" id="chips" aria-label="카테고리"></nav>
<main class="page">
  <div class="grid" id="grid"></div>
  <div class="empty hidden" id="empty"></div>
</main>

<script type="module">
import { sb, CONFIGURED, DEMO, CATEGORIES, esc, renderTopbar, renderNotice, cardHTML, skeletonHTML } from "./app.js";

const params = new URLSearchParams(location.search);
const query = (params.get("q") || "").trim();
let category = params.get("c") || "전체";

renderTopbar({ query });
renderNotice(document.getElementById("chips"));

const chips = document.getElementById("chips");
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");

function drawChips() {
  chips.innerHTML = ["전체", ...CATEGORIES]
    .map((c) => `<button class="chip ${c === category ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`)
    .join("");
}
chips.addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b) return;
  category = b.dataset.c;
  const u = new URL(location.href);
  category === "전체" ? u.searchParams.delete("c") : u.searchParams.set("c", category);
  history.replaceState(null, "", u);
  drawChips();
  load();
});

async function fetchVideos() {
  if (!CONFIGURED) {
    return DEMO.filter((v) =>
      (category === "전체" || v.category === category) &&
      (!query || v.title.toLowerCase().includes(query.toLowerCase())));
  }
  const client = await sb();
  let q = client.from("videos").select("*").order("created_at", { ascending: false }).limit(200);
  if (category !== "전체") q = q.eq("category", category);
  if (query) q = q.ilike("title", `%${query.replace(/[%_,()\\]/g, " ")}%`);
  const { data, error } = await q;
  if (error) throw error;
  return data;
}

async function load() {
  grid.innerHTML = skeletonHTML();
  empty.classList.add("hidden");
  try {
    const list = await fetchVideos();
    grid.innerHTML = list.map((v) => cardHTML(v)).join("");
    if (!list.length) {
      empty.innerHTML = query
        ? `<h2>'${esc(query)}' 검색 결과가 없어요</h2><p>다른 단어로 검색해 보세요.</p>`
        : `<h2>아직 올라온 영상이 없어요</h2><p>오른쪽 위 <b>만들기</b>를 눌러 첫 영상을 올려보세요.</p>`;
      empty.classList.remove("hidden");
    }
  } catch (err) {
    console.error(err);
    grid.innerHTML = "";
    empty.innerHTML = `<h2>영상을 불러오지 못했어요</h2><p>${esc(err.message || err)}</p><p>Supabase 설정(README.md)을 다시 확인해 주세요.</p>`;
    empty.classList.remove("hidden");
  }
}

drawChips();
load();
</script>
</body>
</html>
